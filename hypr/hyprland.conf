# ═══════════════════════════════════════
# NVIDIA
# ═══════════════════════════════════════
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct
env = __GL_GSYNC_ALLOWED,0
env = __GL_VRR_ALLOWED,0
env = QT_QPA_PLATFORMTHEME,qt6ct
env = MOZ_ENABLE_WAYLAND,1

# ═══════════════════════════════════════
# AUTOSTART
# ═══════════════════════════════════════
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = awww-daemon
exec-once = awww img ~/Pictures/wallpapers/wallpaper3.jpg --transition-type fade --transition-duration 1
exec-once = waybar
exec-once = dunst
exec-once = numlockx on
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = dbus-update-activation-environment --all
exec-once = kded6

# ═══════════════════════════════════════
# MONITORES
# ═══════════════════════════════════════
monitor = DP-2,2560x1440@144,2560x0,1
monitor = HDMI-A-2,2560x1440@144,0x0,1
monitor = HDMI-A-1,2560x1440@60,2560x-1440,1
# ═══════════════════════════════════════
# Workspace
# ═══════════════════════════════════════
workspace = 1, monitor:DP-2
workspace = 2, monitor:HDMI-A-2
workspace = 3, monitor:HDMI-A-1
# ═══════════════════════════════════════
# VARIABLES
# ═══════════════════════════════════════
$mainMod = SUPER
$terminal = kitty
$fileManager = dolphin
$menu = rofi -show drun -theme ~/.config/rofi/themes/ribbon/ribbon_top.rasi
# ═══════════════════════════════════════
# APARIENCIA
# ═══════════════════════════════════════
general {
    gaps_in = 5
    gaps_out = 15
    border_size = 2
    col.active_border = rgba(8aadf4ff) rgba(c6a0f6ff) 45deg
    col.inactive_border = rgba(1e2030ff)
    resize_on_border = true
    layout = dwindle
}

decoration {
    rounding = 10
    blur {
        enabled = true
        size = 5
        passes = 3
        new_optimizations = true
    }
    shadow {
        enabled = true
        range = 15
        render_power = 2
        color = rgba(1a1a2ecc)
    }
}

animations {
    enabled = true
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.1
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = liner, 1, 1, 1, 1
    animation = windows, 1, 6, wind, slide
    animation = windowsIn, 1, 6, winIn, slide
    animation = windowsOut, 1, 5, winOut, slide
    animation = windowsMove, 1, 5, wind, slide
    animation = border, 1, 1, liner
    animation = fade, 1, 10, default
    animation = workspaces, 1, 5, wind
}

dwindle {
    preserve_split = true
}

cursor {
    no_hardware_cursors = true
}

input {
    kb_layout = us
    kb_variant = intl
    follow_mouse = 1
    touchpad {
        natural_scroll = false
    }
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# ═══════════════════════════════════════
# KEYBINDS - APPS
# ═══════════════════════════════════════
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, B, exec, firefox
bind = $mainMod, Y, exec, NouTube
bind = $mainMod, T, exec, kitty -e btop
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, Space, exec, $menu
bind = $mainMod, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy
bind = $mainMod, K, exec, ~/.config/hypr/keybinds.sh

# ═══════════════════════════════════════
# KEYBINDS - VENTANAS
# ═══════════════════════════════════════
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, A, togglefloating,
bind = $mainMod, F, fullscreen,
bind = $mainMod, J, layoutmsg, togglesplit
bind = $mainMod, P, pseudo,
bind = $mainMod SHIFT, W, movewindow, mon:+1
bind = SUPER, D, togglespecialworkspace,
bind = SUPER, S, movetoworkspace, special
bind = SUPER SHIFT, S, movetoworkspace, +0
# Foco
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Mover ventanas
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Resize ventanas
bind = $mainMod CTRL, left, resizeactive, -50 0
bind = $mainMod CTRL, right, resizeactive, 50 0
bind = $mainMod CTRL, up, resizeactive, 0 -50
bind = $mainMod CTRL, down, resizeactive, 0 50

# Tab entre ventanas
bind = $mainMod, Tab, exec, rofi -show window -theme ~/.config/rofi/themes/ribbon/ribbon_top.rasi

# ═══════════════════════════════════════
# KEYBINDS - WORKSPACES
# ═══════════════════════════════════════
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7

# Scroll entre workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# ═══════════════════════════════════════
# KEYBINDS - SCREENSHOT
# ═══════════════════════════════════════
bind = , Print, exec, grim - | tee /mnt/SSD2TB/Linux/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png | wl-copy
bind = $mainMod, Print, exec, grim -g "$(slurp)" - | tee /mnt/SSD2TB/Linux/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png | wl-copy
# ═══════════════════════════════════════
# KEYBINDS - VOLUMEN
# ═══════════════════════════════════════
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# ═══════════════════════════════════════
# KEYBINDS - BRILLO
# ═══════════════════════════════════════
bind = , XF86MonBrightnessUp, exec, brightnessctl set 10%+
bind = , XF86MonBrightnessDown, exec, brightnessctl set 10%-
